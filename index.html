<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Tells phones to lay the page out at their real width instead of a zoomed-out desktop width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bouncemarket</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; margin: 8px; }
    p { margin: 8px 0; }
    /* The board shrinks to fit a small screen, keeping its shape, and never takes more than
       half the screen's height, so the bet buttons stay in view below it. */
    canvas { background: #222; display: block; margin: 0 auto; max-width: 100%; max-height: 50dvh; }
    #bets { display: flex; max-width: 400px; margin: 0 auto; }
    .side { flex: 1; }
    .side button {
      width: 56px; height: 56px; border: none; border-radius: 50%;
      font-size: 32px; font-weight: bold; color: #111; cursor: pointer;
      touch-action: manipulation;  /* stops a quick double tap from zooming the page */
    }
    .side button:active { transform: scale(0.9); }
    .side button:disabled { opacity: 0.3; cursor: default; }
    .side .bet { display: inline-block; width: 48px; font-size: 28px; font-weight: bold; }
    #left-side button { background: #f9a8d4; }
    #right-side button { background: #93c5fd; }
    /* Room for two lines, so the page doesn't jump when a long message wraps on a phone. */
    #message { font-size: 18px; font-weight: bold; color: #fc3; min-height: 2.4em; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <p id="message">&nbsp;</p>
  <p>Points: <span id="points"></span></p>
  <div id="bets">
    <div class="side" id="left-side">
      <p>Bet on left</p>
      <button data-side="left" data-change="-1">&minus;</button>
      <span class="bet" id="bet-left">0</span>
      <button data-side="left" data-change="1">+</button>
      <p>Others: <span id="others-left">0</span> &nbsp; Pays: <span id="pays-left"></span></p>
    </div>
    <div class="side" id="right-side">
      <p>Bet on right</p>
      <button data-side="right" data-change="-1">&minus;</button>
      <span class="bet" id="bet-right">0</span>
      <button data-side="right" data-change="1">+</button>
      <p>Others: <span id="others-right">0</span> &nbsp; Pays: <span id="pays-right"></span></p>
    </div>
  </div>
  <p>Landed left: <span id="left"></span> &nbsp;|&nbsp; Landed right: <span id="right"></span></p>
  <p>Players online: <span id="online"></span></p>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");
    const FPS = 60;  // the ball moves one frame every 1/60 second
    let board;
    let game = null;  // the latest public message: the state of the shared game
    let me = null;  // the latest private message: this player's points and bets
    let queue = [];  // ball positions waiting until their frame is due, each [frame, x, y]
    let dropStart = null;  // on our clock, the moment the ball dropped

    // A random id, remembered by this browser, that tells the server which player we are.
    let playerId = localStorage.getItem("playerId");
    if (!playerId) {
      playerId = crypto.randomUUID();
      localStorage.setItem("playerId", playerId);
    }

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fill();
    }

    // Draw the pins and divider, plus the ball if a position is given.
    function draw(ball) {
      ctx.clearRect(0, 0, board.width, board.height);
      ctx.strokeStyle = "#888";
      ctx.beginPath();
      ctx.moveTo(board.width / 2, board.last_row_y);
      ctx.lineTo(board.width / 2, board.height);
      ctx.stroke();
      for (const [x, y] of board.pins) circle(x, y, board.pin_r, "#888");
      if (ball) circle(ball[0], ball[1], board.ball_r, "#fc3");
    }

    // Show everything except the ball, from the latest public and private messages.
    function render() {
      if (!game || !me) return;
      document.getElementById("points").textContent = me.points;
      document.getElementById("left").textContent = game.landed.left;
      document.getElementById("right").textContent = game.landed.right;
      document.getElementById("online").textContent = game.online;

      // game.totals is everyone's bets on each side, ours included. What each point on a side
      // gets back if that side wins is the whole pot divided by the points bet on that side.
      const mine = me.bets;
      const myTotal = mine.left + mine.right;
      const pot = game.totals.left + game.totals.right;
      for (const side of ["left", "right"]) {
        const onSide = game.totals[side];
        document.getElementById("bet-" + side).textContent = mine[side];
        // Our own bet can be a moment newer than the totals, so don't let this dip below zero.
        document.getElementById("others-" + side).textContent = Math.max(0, onSide - mine[side]);
        document.getElementById("pays-" + side).textContent = onSide ? "×" + (pot / onSide).toFixed(2) : "–";
      }

      // Bets can go up while betting is open, and down only before the ball drops.
      for (const betButton of document.querySelectorAll(".side button")) {
        if (betButton.dataset.change === "1") {
          betButton.disabled = !game.betting_open || myTotal + 1 > me.points;
        } else {
          betButton.disabled = game.dropping || mine[betButton.dataset.side] === 0;
        }
      }

      if (game.dropping) {
        message.textContent = game.betting_open ? "Betting is open: you can still add to your bets" : "Betting closed";
      } else {
        let text = `Next drop in ${Math.ceil(game.seconds_to_drop)}`;
        if (game.last_bucket) {
          const sign = me.last_won > 0 ? "+" : "";
          text = `Landed ${game.last_bucket}: ${sign}${me.last_won} points. ` + text;
        }
        message.textContent = text;
      }
    }

    // Each plus/minus button asks the server to change one side's bet by one.
    // The server answers with our new points and bets.
    for (const betButton of document.querySelectorAll(".side button")) {
      betButton.onclick = async () => {
        const response = await fetch("/bet", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            player: playerId,
            side: betButton.dataset.side,
            change: Number(betButton.dataset.change),
          }),
        });
        if (response.ok) {
          me = await response.json();
          render();
        }
      };
    }

    // The public "game" message arrives 10 times a second. While the ball is falling, each
    // one carries the next few ball positions, a little ahead of time. We queue them and
    // play them back on our own clock, so uneven arrival times don't make the ball stutter.
    function receiveGame(update) {
      game = update;
      render();
      if (!game.dropping) {
        queue = [];
        dropStart = null;
        draw(game.ball);
        return;
      }
      // game.frame is the frame the server is on right now, which tells us when the drop began.
      if (dropStart === null) dropStart = performance.now() - game.frame * 1000 / FPS;
      game.positions.forEach(([x, y], i) => queue.push([game.first_position + i, x, y]));
    }

    // Runs before every screen refresh: draw the newest queued position whose frame is due.
    function play(now) {
      if (dropStart !== null) {
        const dueFrame = (now - dropStart) / 1000 * FPS;
        let latest = null;
        while (queue.length > 0 && queue[0][0] <= dueFrame) latest = queue.shift();
        if (latest) draw([latest[1], latest[2]]);
      }
      requestAnimationFrame(play);
    }

    async function init() {
      const response = await fetch("/board");
      board = await response.json();
      canvas.width = board.width;
      canvas.height = board.height;
      draw(null);
      // The server sends a stream of messages for as long as the page is open: a private
      // "me" message with our points and bets, and the public "game" message.
      // If the connection drops, the browser reconnects by itself.
      const stream = new EventSource("/events?player=" + playerId);
      stream.addEventListener("me", (event) => { me = JSON.parse(event.data); render(); });
      stream.addEventListener("game", (event) => receiveGame(JSON.parse(event.data)));
      requestAnimationFrame(play);
    }
    init();
  </script>
</body>
</html>
