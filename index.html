<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>bouncemarket</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    canvas { background: #222; display: block; margin: 16px auto; }
    #bets { display: flex; width: 400px; margin: 0 auto; }
    .side { flex: 1; }
    .side button {
      width: 56px; height: 56px; border: none; border-radius: 50%;
      font-size: 32px; font-weight: bold; color: #111; cursor: pointer;
    }
    .side button:active { transform: scale(0.9); }
    .side button:disabled { opacity: 0.3; cursor: default; }
    .side .bet { display: inline-block; width: 48px; font-size: 28px; font-weight: bold; }
    #left-side button { background: #f9a8d4; }
    #right-side button { background: #93c5fd; }
    #drop {
      font-size: 20px; font-weight: bold; padding: 12px 48px; margin-top: 16px;
      border: none; border-radius: 28px; background: #fc3; color: #111; cursor: pointer;
    }
    #drop:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <p>Points: <span id="points"></span></p>
  <div id="bets">
    <div class="side" id="left-side">
      <p>Bet on left</p>
      <button data-side="left" data-change="-1">&minus;</button>
      <span class="bet" id="bet-left">0</span>
      <button data-side="left" data-change="1">+</button>
      <p>Them: <span id="their-left">0</span> &nbsp; Pays: <span id="pays-left"></span></p>
    </div>
    <div class="side" id="right-side">
      <p>Bet on right</p>
      <button data-side="right" data-change="-1">&minus;</button>
      <span class="bet" id="bet-right">0</span>
      <button data-side="right" data-change="1">+</button>
      <p>Them: <span id="their-right">0</span> &nbsp; Pays: <span id="pays-right"></span></p>
    </div>
  </div>
  <button id="drop">Drop</button>
  <p id="message">&nbsp;</p>
  <p>Landed left: <span id="left"></span> &nbsp;|&nbsp; Landed right: <span id="right"></span></p>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const button = document.getElementById("drop");
    const message = document.getElementById("message");
    const FPS = 60;  // the server sends one ball position per 1/60 second
    let board;
    let myBets = { left: 0, right: 0 };
    let theirBets = { left: 0, right: 0 };

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fill();
    }

    // Draw the pins and divider, plus the ball if a position is given.
    function draw(ball) {
      ctx.clearRect(0, 0, board.width, board.height);
      ctx.strokeStyle = "#888";
      ctx.beginPath();
      ctx.moveTo(board.width / 2, board.last_row_y);
      ctx.lineTo(board.width / 2, board.height);
      ctx.stroke();
      for (const [x, y] of board.pins) circle(x, y, board.pin_r, "#888");
      if (ball) circle(ball[0], ball[1], board.ball_r, "#fc3");
    }

    // Show both players' bets, and what each point on a side gets back if that side wins:
    // the whole pot divided by the points bet on that side.
    function showMarket() {
      const pot = myBets.left + myBets.right + theirBets.left + theirBets.right;
      for (const side of ["left", "right"]) {
        const onSide = myBets[side] + theirBets[side];
        document.getElementById("bet-" + side).textContent = myBets[side];
        document.getElementById("their-" + side).textContent = theirBets[side];
        document.getElementById("pays-" + side).textContent = onSide ? "×" + (pot / onSide).toFixed(2) : "–";
      }
    }

    function showState(state) {
      document.getElementById("points").textContent = state.points;
      document.getElementById("left").textContent = state.left;
      document.getElementById("right").textContent = state.right;
      myBets = state.bets;
      showMarket();
    }

    async function post(url, data) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      return response.json();
    }

    // Turn the minus buttons and the plus buttons on or off.
    function enableBetButtons(minus, plus) {
      for (const betButton of document.querySelectorAll(".side button")) {
        betButton.disabled = betButton.dataset.change === "1" ? !plus : !minus;
      }
    }

    // Each plus/minus button asks the server to change one side's bet by one.
    for (const betButton of document.querySelectorAll(".side button")) {
      betButton.onclick = async () => {
        const result = await post("/bet", {
          side: betButton.dataset.side,
          change: Number(betButton.dataset.change),
        });
        if (result.error) message.textContent = result.error;
        else showState(result.state);
      };
    }

    // Called when a drop is over, to get ready for the next one.
    function endDrop(text) {
      message.textContent = text;
      theirBets = { left: 0, right: 0 };
      showMarket();
      enableBetButtons(true, true);
      button.disabled = false;
    }

    // Ask the server to drop a ball, and listen to the stream of events it sends back:
    // a "frame" event for each new ball position, then one "result" event when it lands.
    // The server sends each frame a little early. We keep the frames as they arrive and play
    // them back on our own clock, so uneven arrival times don't make the ball stutter.
    button.onclick = () => {
      button.disabled = true;
      enableBetButtons(false, true);
      message.textContent = "Betting is open: you can still add to your bets";
      const stream = new EventSource("/drop");
      const frames = [];
      let start;  // when the first frame arrived
      let shown = -1;  // index of the frame on screen
      let playing = true;

      // Show the frame that is due now, or the newest one we have if the stream has fallen behind.
      function play(now) {
        if (!playing) return;
        const due = Math.floor((now - start) / 1000 * FPS);
        const i = Math.min(due, frames.length - 1);
        if (i > shown) {
          shown = i;
          const frame = frames[i];
          draw([frame.x, frame.y]);
          theirBets = frame.theirs;
          showMarket();
          if (!frame.betting_open) {
            enableBetButtons(false, false);
            message.textContent = "Betting closed";
          }
        }
        requestAnimationFrame(play);
      }

      stream.addEventListener("frame", (event) => {
        frames.push(JSON.parse(event.data));
        if (frames.length === 1) {
          start = performance.now();
          requestAnimationFrame(play);
        }
      });

      stream.addEventListener("result", (event) => {
        stream.close();
        playing = false;
        const last = frames[frames.length - 1];
        draw([last.x, last.y]);
        const state = JSON.parse(event.data);
        const sign = state.last_won > 0 ? "+" : "";
        endDrop(`Landed ${state.last_bucket}: ${sign}${state.last_won} points`);
        showState(state);
      });

      // Without close(), the browser would reconnect and start another drop.
      stream.onerror = () => {
        stream.close();
        playing = false;
        endDrop("Couldn't follow the drop. Try again in a moment.");
      };
    };

    async function init() {
      const response = await fetch("/board");
      board = await response.json();
      canvas.width = board.width;
      canvas.height = board.height;
      draw();
      showState(board.state);
    }
    init();
  </script>
</body>
</html>
