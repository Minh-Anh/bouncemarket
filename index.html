<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>bouncemarket</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    canvas { background: #222; display: block; margin: 16px auto; }
    #bets { display: flex; width: 400px; margin: 0 auto; }
    .side { flex: 1; }
    .side button {
      width: 56px; height: 56px; border: none; border-radius: 50%;
      font-size: 32px; font-weight: bold; color: #111; cursor: pointer;
    }
    .side button:active { transform: scale(0.9); }
    .side button:disabled { opacity: 0.3; cursor: default; }
    .side .bet { display: inline-block; width: 48px; font-size: 28px; font-weight: bold; }
    #left-side button { background: #f9a8d4; }
    #right-side button { background: #93c5fd; }
    #message { font-size: 20px; font-weight: bold; color: #fc3; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <p id="message">&nbsp;</p>
  <p>Points: <span id="points"></span></p>
  <div id="bets">
    <div class="side" id="left-side">
      <p>Bet on left</p>
      <button data-side="left" data-change="-1">&minus;</button>
      <span class="bet" id="bet-left">0</span>
      <button data-side="left" data-change="1">+</button>
      <p>Others: <span id="others-left">0</span> &nbsp; Pays: <span id="pays-left"></span></p>
    </div>
    <div class="side" id="right-side">
      <p>Bet on right</p>
      <button data-side="right" data-change="-1">&minus;</button>
      <span class="bet" id="bet-right">0</span>
      <button data-side="right" data-change="1">+</button>
      <p>Others: <span id="others-right">0</span> &nbsp; Pays: <span id="pays-right"></span></p>
    </div>
  </div>
  <p>Landed left: <span id="left"></span> &nbsp;|&nbsp; Landed right: <span id="right"></span></p>
  <p>Players online: <span id="online"></span></p>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");
    const FPS = 60;  // the ball moves one frame every 1/60 second
    let board;
    let queue = [];  // snapshots of the falling ball, waiting until their frame is due
    let dropStart = null;  // on our clock, the moment the ball dropped

    // A random id, remembered by this browser, that tells the server which player we are.
    let playerId = localStorage.getItem("playerId");
    if (!playerId) {
      playerId = crypto.randomUUID();
      localStorage.setItem("playerId", playerId);
    }

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fill();
    }

    // Draw the pins and divider, plus the ball if a position is given.
    function draw(ball) {
      ctx.clearRect(0, 0, board.width, board.height);
      ctx.strokeStyle = "#888";
      ctx.beginPath();
      ctx.moveTo(board.width / 2, board.last_row_y);
      ctx.lineTo(board.width / 2, board.height);
      ctx.stroke();
      for (const [x, y] of board.pins) circle(x, y, board.pin_r, "#888");
      if (ball) circle(ball[0], ball[1], board.ball_r, "#fc3");
    }

    // Show one snapshot from the server: everything this player can see right now.
    function show(snapshot) {
      draw(snapshot.ball);
      document.getElementById("points").textContent = snapshot.points;
      document.getElementById("left").textContent = snapshot.landed.left;
      document.getElementById("right").textContent = snapshot.landed.right;
      document.getElementById("online").textContent = snapshot.online;

      // What each point on a side gets back if that side wins: the whole pot divided by
      // the points bet on that side.
      const mine = snapshot.bets;
      const others = snapshot.others;
      const myTotal = mine.left + mine.right;
      const pot = myTotal + others.left + others.right;
      for (const side of ["left", "right"]) {
        const onSide = mine[side] + others[side];
        document.getElementById("bet-" + side).textContent = mine[side];
        document.getElementById("others-" + side).textContent = others[side];
        document.getElementById("pays-" + side).textContent = onSide ? "×" + (pot / onSide).toFixed(2) : "–";
      }

      // Bets can go up while betting is open, and down only before the ball drops.
      for (const betButton of document.querySelectorAll(".side button")) {
        if (betButton.dataset.change === "1") {
          betButton.disabled = !snapshot.betting_open || myTotal + 1 > snapshot.points;
        } else {
          betButton.disabled = snapshot.dropping || mine[betButton.dataset.side] === 0;
        }
      }

      if (snapshot.dropping) {
        message.textContent = snapshot.betting_open ? "Betting is open: you can still add to your bets" : "Betting closed";
      } else {
        let text = `Next drop in ${Math.ceil(snapshot.seconds_to_drop)}`;
        if (snapshot.last_bucket) {
          const sign = snapshot.last_won > 0 ? "+" : "";
          text = `Landed ${snapshot.last_bucket}: ${sign}${snapshot.last_won} points. ` + text;
        }
        message.textContent = text;
      }
    }

    // Each plus/minus button asks the server to change one side's bet by one.
    // The new bet shows up in the next snapshot.
    for (const betButton of document.querySelectorAll(".side button")) {
      betButton.onclick = () => {
        fetch("/bet", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            player: playerId,
            side: betButton.dataset.side,
            change: Number(betButton.dataset.change),
          }),
        });
      };
    }

    // While the ball is falling, the server sends each snapshot a few frames early. We queue
    // them as they arrive and play them back on our own clock, so uneven arrival times
    // don't make the ball stutter. Between drops there is nothing to smooth, so we show
    // each snapshot straight away.
    function receive(snapshot) {
      if (!snapshot.dropping) {
        queue = [];
        dropStart = null;
        show(snapshot);
        return;
      }
      if (dropStart === null) {
        const framesSinceDrop = snapshot.frame - board.buffer_frames;
        dropStart = performance.now() - framesSinceDrop * 1000 / FPS;
      }
      queue.push(snapshot);
    }

    // Runs before every screen refresh: show the newest queued snapshot whose frame is due.
    function play(now) {
      if (dropStart !== null) {
        const dueFrame = (now - dropStart) / 1000 * FPS;
        let latest = null;
        while (queue.length > 0 && queue[0].frame <= dueFrame) latest = queue.shift();
        if (latest) show(latest);
      }
      requestAnimationFrame(play);
    }

    async function init() {
      const response = await fetch("/board");
      board = await response.json();
      canvas.width = board.width;
      canvas.height = board.height;
      // The server sends a stream of snapshots for as long as the page is open.
      // If the connection drops, the browser reconnects by itself.
      const stream = new EventSource("/events?player=" + playerId);
      stream.onmessage = (event) => receive(JSON.parse(event.data));
      requestAnimationFrame(play);
    }
    init();
  </script>
</body>
</html>
