<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Tells phones to lay the page out at their real width instead of a zoomed-out desktop width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bouncemarket</title>
  <style>
    /* The whole palette: yellow as the accent, deep purple for the buy buttons, and three greys. */
    :root {
      --background: #111;
      --panel: #1c1c1c;
      --text: #eee;
      --muted: #999;
      --accent: #fc3;
      --buy: #5b21b6;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }  /* without this, a display rule below would un-hide a hidden element */
    body {
      margin: 0; background: var(--background); color: var(--text);
      font: 15px/1.4 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;  /* digits all the same width, so numbers don't jiggle as they change */
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 18px; }
    h2, .label { font-size: 12px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
    .panel { background: var(--panel); border-radius: 12px; padding: 12px 14px; }

    /* Top bar: the title on the left, this player's name and points on the right. */
    #page { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; }
    #points { font-size: 18px; font-weight: bold; color: var(--accent); }

    /* Two columns side by side: the game, then the leaderboard taking the space that is left.
       On a narrow screen the leaderboard doesn't fit beside the game, so it wraps underneath. */
    main { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px; }
    #game { flex: 0 1 400px; display: grid; gap: 10px; }
    #sidebar { flex: 1 1 260px; display: grid; gap: 10px; }

    /* The board shrinks to fit a small screen, keeping its shape, and never takes more than
       half the screen's height, so the buy buttons stay in view below it. */
    #board { padding: 0; }
    canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 50dvh; }

    /* The two halves sit on one line when there is room, and stack on a narrow phone. */
    #status-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 12px; font-size: 17px; }
    #status { font-weight: bold; color: var(--accent); }
    #countdown { color: var(--muted); }

    /* One panel per side: its price and our holding on the left, its buy button on the right. */
    #market { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .side { display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 30px; font-weight: bold; line-height: 1.2; }
    .side button {
      width: 56px; height: 56px; border: none; border-radius: 50%;
      font-size: 32px; font-weight: bold; color: var(--text); background: var(--buy); cursor: pointer;
      touch-action: manipulation;  /* stops a quick double tap from zooming the page */
    }
    .side button:active { transform: scale(0.9); }
    .side button:disabled { opacity: 0.3; cursor: default; }

    #claim { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    #name, #claim button { font: inherit; padding: 6px 10px; border-radius: 8px; border: none; }
    #name { flex: 1; min-width: 0; }
    #claim button { background: var(--accent); color: #111; font-weight: bold; cursor: pointer; }
    #claim-error { width: 100%; }

    /* Each row: its rank (added by the browser), the name, and the points pushed to the right. */
    #leaderboard { margin: 8px 0 0; padding-left: 24px; }
    #leaderboard li { padding: 3px 0; }
    #leaderboard .points { float: right; font-weight: bold; }
    #leaderboard .me { color: var(--accent); }
  </style>
</head>
<body>
<div id="page">
  <header>
    <h1>bouncemarket</h1>
    <p><span class="muted" id="my-name"></span> &nbsp;<span id="points"></span> <span class="muted">points</span></p>
  </header>

  <main>
    <section id="game">
      <div class="panel" id="board"><canvas id="canvas"></canvas></div>

      <div id="status-line">
        <span id="status">&nbsp;</span>
        <span id="countdown"></span>
      </div>

      <div id="market">
        <div class="side panel" id="left-side">
          <div>
            <p class="label">Left</p>
            <p class="price" id="price-left"></p>
            <p class="muted">You hold <span id="shares-left">0</span></p>
          </div>
          <button data-side="left">+</button>
        </div>
        <div class="side panel" id="right-side">
          <div>
            <p class="label">Right</p>
            <p class="price" id="price-right"></p>
            <p class="muted">You hold <span id="shares-right">0</span></p>
          </div>
          <button data-side="right">+</button>
        </div>
      </div>

      <p class="muted">+ buys one share at the price shown. A share pays 1 point if the ball lands on its side.</p>
    </section>

    <section id="sidebar">
      <div class="panel">
        <h2>Leaderboard</h2>
        <!-- Shown until this player has claimed a name. -->
        <form id="claim" hidden>
          <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
          <button>Join</button>
          <p class="muted" id="claim-error"></p>
        </form>
        <ol id="leaderboard"></ol>
      </div>
      <p class="muted">
        Landed left <span id="left"></span> · right <span id="right"></span>
        &nbsp;·&nbsp; <span id="online"></span> online
      </p>
    </section>
  </main>
</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const FPS = 60;  // the ball moves one frame every 1/60 second
    let board;
    let game = null;  // the latest public message: the state of the shared game
    let me = null;  // the latest private message: this player's name, points and shares
    let leaderboard = [];  // the latest leaderboard message: the top players' names and points
    let queue = [];  // ball positions waiting until their frame is due, each [frame, x, y]
    let dropStart = null;  // on our clock, the moment the ball dropped

    // A random id, remembered by this browser, that tells the server which player we are.
    let playerId = localStorage.getItem("playerId");
    if (!playerId) {
      playerId = crypto.randomUUID();
      localStorage.setItem("playerId", playerId);
    }

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fill();
    }

    // Draw the pins and divider, plus the ball if a position is given.
    function draw(ball) {
      ctx.clearRect(0, 0, board.width, board.height);
      ctx.strokeStyle = "#888";
      ctx.beginPath();
      ctx.moveTo(board.width / 2, board.last_row_y);
      ctx.lineTo(board.width / 2, board.height);
      ctx.stroke();
      for (const [x, y] of board.pins) circle(x, y, board.pin_r, "#888");
      if (ball) circle(ball[0], ball[1], board.ball_r, "#fc3");
    }

    // Show everything except the ball, from the latest public and private messages.
    function render() {
      if (!game || !me) return;
      document.getElementById("points").textContent = me.points;
      document.getElementById("left").textContent = game.landed.left;
      document.getElementById("right").textContent = game.landed.right;
      document.getElementById("online").textContent = game.online;

      // Offer the name form until we have a name, then show the name instead.
      document.getElementById("claim").hidden = me.name !== null;
      document.getElementById("my-name").textContent = me.name || "Guest";

      // A share can be bought while betting is open, if we can afford its price.
      for (const buyButton of document.querySelectorAll(".side button")) {
        const side = buyButton.dataset.side;
        const price = game.prices[side];
        document.getElementById("price-" + side).textContent = price.toFixed(2);
        document.getElementById("shares-" + side).textContent = me.shares[side];
        buyButton.disabled = !game.betting_open || price > me.points;
      }

      // The status line: what is happening on the left, and the countdown on the right.
      let status = "Waiting for the first drop";
      if (game.dropping) {
        status = game.betting_open ? "Betting open" : "Betting closed";
      } else if (game.last_bucket) {
        const sign = me.last_won > 0 ? "+" : "";
        status = `Landed ${game.last_bucket} · ${sign}${me.last_won} points`;
      }
      document.getElementById("status").textContent = status;
      document.getElementById("countdown").textContent =
        game.dropping ? "" : `Next drop in ${Math.ceil(game.seconds_to_drop)}s`;
    }

    // Each plus button asks the server to buy one share on its side at the current price.
    // The server answers with our new points and shares.
    for (const buyButton of document.querySelectorAll(".side button")) {
      buyButton.onclick = async () => {
        const response = await fetch("/buy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ player: playerId, side: buyButton.dataset.side }),
        });
        if (response.ok) {
          me = await response.json();
          render();
        }
      };
    }

    // Claim a name, which puts us on the leaderboard.
    document.getElementById("claim").onsubmit = async (event) => {
      event.preventDefault();  // stop the browser reloading the page, its default for forms
      const response = await fetch("/name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player: playerId, name: document.getElementById("name").value }),
      });
      const result = await response.json();
      if (response.ok) {
        me = result;
        render();
        showLeaderboard();  // to highlight our new name
      } else {
        document.getElementById("claim-error").textContent = result.error;
      }
    };

    function showLeaderboard() {
      const rows = leaderboard.map((entry) => {
        const row = document.createElement("li");
        const name = document.createElement("span");
        const points = document.createElement("span");
        name.textContent = entry.name;
        points.textContent = entry.points;
        points.className = "points";
        row.append(name, points);
        if (me && entry.name === me.name) row.className = "me";
        return row;
      });
      document.getElementById("leaderboard").replaceChildren(...rows);
    }

    // The public "game" message arrives 10 times a second. While the ball is falling, each
    // one carries the next few ball positions, a little ahead of time. We queue them and
    // play them back on our own clock, so uneven arrival times don't make the ball stutter.
    function receiveGame(update) {
      game = update;
      render();
      if (!game.dropping) {
        queue = [];
        dropStart = null;
        draw(game.ball);
        return;
      }
      // game.frame is the frame the server is on right now, which tells us when the drop began.
      if (dropStart === null) dropStart = performance.now() - game.frame * 1000 / FPS;
      game.positions.forEach(([x, y], i) => queue.push([game.first_position + i, x, y]));
    }

    // Runs before every screen refresh: draw the newest queued position whose frame is due.
    function play(now) {
      if (dropStart !== null) {
        const dueFrame = (now - dropStart) / 1000 * FPS;
        let latest = null;
        while (queue.length > 0 && queue[0][0] <= dueFrame) latest = queue.shift();
        if (latest) draw([latest[1], latest[2]]);
      }
      requestAnimationFrame(play);
    }

    async function init() {
      const response = await fetch("/board");
      board = await response.json();
      canvas.width = board.width;
      canvas.height = board.height;
      draw(null);
      // The server sends a stream of messages for as long as the page is open: a private
      // "me" message with our name, points and shares, the public "game" message, and the leaderboard.
      // If the connection drops, the browser reconnects by itself.
      const stream = new EventSource("/events?player=" + playerId);
      stream.addEventListener("me", (event) => { me = JSON.parse(event.data); render(); showLeaderboard(); });
      stream.addEventListener("leaderboard", (event) => { leaderboard = JSON.parse(event.data); showLeaderboard(); });
      stream.addEventListener("game", (event) => receiveGame(JSON.parse(event.data)));
      requestAnimationFrame(play);
    }
    init();
  </script>
</body>
</html>
