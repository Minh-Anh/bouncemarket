<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>bouncemarket</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    canvas { background: #222; display: block; margin: 16px auto; }
    #bets { display: flex; width: 400px; margin: 0 auto; }
    .side { flex: 1; }
    .side button {
      width: 56px; height: 56px; border: none; border-radius: 50%;
      font-size: 32px; font-weight: bold; color: #111; cursor: pointer;
    }
    .side button:active { transform: scale(0.9); }
    .side span { display: inline-block; width: 48px; font-size: 28px; font-weight: bold; }
    #left-side button { background: #f9a8d4; }
    #right-side button { background: #93c5fd; }
    #drop {
      font-size: 20px; font-weight: bold; padding: 12px 48px; margin-top: 16px;
      border: none; border-radius: 28px; background: #fc3; color: #111; cursor: pointer;
    }
    #drop:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <p>Points: <span id="points"></span></p>
  <div id="bets">
    <div class="side" id="left-side">
      <p>Bet on left</p>
      <button data-side="left" data-change="-1">&minus;</button>
      <span id="bet-left">0</span>
      <button data-side="left" data-change="1">+</button>
    </div>
    <div class="side" id="right-side">
      <p>Bet on right</p>
      <button data-side="right" data-change="-1">&minus;</button>
      <span id="bet-right">0</span>
      <button data-side="right" data-change="1">+</button>
    </div>
  </div>
  <button id="drop">Drop</button>
  <p id="message">&nbsp;</p>
  <p>Landed left: <span id="left"></span> &nbsp;|&nbsp; Landed right: <span id="right"></span></p>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const button = document.getElementById("drop");
    const message = document.getElementById("message");
    const FPS = 60;  // the server sends one ball position per 1/60 second
    const bets = { left: 0, right: 0 };
    let points = 0;
    let board;

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fill();
    }

    // Draw the pins and divider, plus the ball if a position is given.
    function draw(ball) {
      ctx.clearRect(0, 0, board.width, board.height);
      ctx.strokeStyle = "#888";
      ctx.beginPath();
      ctx.moveTo(board.width / 2, board.last_row_y);
      ctx.lineTo(board.width / 2, board.height);
      ctx.stroke();
      for (const [x, y] of board.pins) circle(x, y, board.pin_r, "#888");
      if (ball) circle(ball[0], ball[1], board.ball_r, "#fc3");
    }

    function showBets() {
      document.getElementById("bet-left").textContent = bets.left;
      document.getElementById("bet-right").textContent = bets.right;
    }

    // Each plus/minus button changes one side's bet by one, if the new bets are allowed.
    for (const betButton of document.querySelectorAll(".side button")) {
      betButton.onclick = () => {
        if (button.disabled) return;  // a ball is dropping
        const side = betButton.dataset.side;
        const change = Number(betButton.dataset.change);
        if (bets[side] + change >= 0 && bets.left + bets.right + change <= points) {
          bets[side] += change;
          showBets();
        }
      };
    }

    function showState(state) {
      points = state.points;
      document.getElementById("points").textContent = state.points;
      document.getElementById("left").textContent = state.left;
      document.getElementById("right").textContent = state.right;
    }

    // Play back the path the server computed, then reveal the result.
    function animate(result) {
      const start = performance.now();
      function frame(now) {
        const i = Math.floor((now - start) / 1000 * FPS);
        if (i < result.path.length) {
          draw(result.path[i]);
          requestAnimationFrame(frame);
        } else {
          draw(result.path[result.path.length - 1]);
          showState(result.state);
          const sign = result.won > 0 ? "+" : "";
          message.textContent = `Landed ${result.bucket}: ${sign}${result.won} points`;
          bets.left = bets.right = 0;
          showBets();
          button.disabled = false;
        }
      }
      requestAnimationFrame(frame);
    }

    button.onclick = async () => {
      const response = await fetch("/drop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bets),
      });
      const result = await response.json();
      if (!response.ok) {
        message.textContent = result.error;
        return;
      }
      message.innerHTML = "&nbsp;";
      button.disabled = true;
      animate(result);
    };

    async function init() {
      const response = await fetch("/board");
      board = await response.json();
      canvas.width = board.width;
      canvas.height = board.height;
      draw();
      showState(board.state);
    }
    init();
  </script>
</body>
</html>
