<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Tells phones to lay the page out at their real width instead of a zoomed-out desktop width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bouncemarket</title>
  <style>
    /* The whole palette: yellow as the accent, blue for the left side and orange for the right
       (the buy buttons and the odds bar), and three greys. */
    :root {
      --background: #111;
      --panel: #1c1c1c;
      --text: #eee;
      --muted: #999;
      --accent: #fc3;
      --left: #3987e5;
      --right: #d95926;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }  /* without this, a display rule below would un-hide a hidden element */
    body {
      margin: 0; background: var(--background); color: var(--text);
      font: 15px/1.4 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;  /* digits all the same width, so numbers don't jiggle as they change */
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 18px; }
    h2, .label { font-size: 12px; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
    .panel { background: var(--panel); border-radius: 12px; padding: 12px 14px; }

    /* Top bar: the title on the left, this player's name and points on the right. */
    #page { max-width: 760px; margin: 0 auto; padding: 0 16px 24px; }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; }
    #points { font-size: 18px; font-weight: bold; color: var(--accent); }

    /* Two columns side by side: the game, then the leaderboard taking the space that is left.
       On a narrow screen the leaderboard doesn't fit beside the game, so it wraps underneath. */
    main { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px; }
    #game { flex: 0 1 400px; display: grid; gap: 10px; }
    #sidebar { flex: 1 1 260px; display: grid; gap: 10px; }

    /* The board shrinks to fit a small screen, keeping its shape, and never takes more than
       half the screen's height, so the buy buttons stay in view below it. */
    #board { padding: 20px; }  /* space around the box, so it floats inside the panel */
    canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 50dvh; }

    /* The two halves sit on one line when there is room, and stack on a narrow phone. */
    #status-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; column-gap: 12px; font-size: 17px; }
    #status { font-weight: bold; color: var(--accent); }
    #countdown { color: var(--muted); }

    /* One card per side, stacked: its name, its price per share, our holding, and a buy button across the bottom. */
    #market { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .side { display: grid; gap: 4px; }
    .price { font-size: 30px; font-weight: bold; line-height: 1.2; }
    .side button {
      margin-top: 6px; padding: 10px 6px; border: none; border-radius: 8px;
      font: inherit; font-weight: bold; color: #111; cursor: pointer;  /* dark text reads better than white on both colors */
      touch-action: manipulation;  /* stops a quick double tap from zooming the page */
    }
    .side button:active { transform: scale(0.97); }
    #left-side button { background: var(--left); }
    #right-side button { background: var(--right); }
    .side button:disabled { opacity: 0.3; cursor: default; }

    /* Market odds: each side's share price is the chance the market gives it, shown as a split bar.
       Blue and orange are a validated colorblind-safe pair; the percentages label each side too. */
    #odds-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 17px; font-weight: bold; }
    #odds-bar { display: flex; gap: 2px; height: 10px; margin-top: 6px; }
    #odds-bar div { transition: flex-grow 0.3s; min-width: 4px; }
    #odds-left { background: var(--left); border-radius: 4px 0 0 4px; }
    #odds-right { background: var(--right); border-radius: 0 4px 4px 0; }

    /* Panel headings, with a note (how many are online, whether odds are live) pushed to the right. */
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; }

    #claim { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    #name, #claim button { font: inherit; padding: 6px 10px; border-radius: 8px; border: none; }
    #name { flex: 1; min-width: 0; }
    #claim button { background: var(--accent); color: #111; font-weight: bold; cursor: pointer; }
    #claim-error { width: 100%; }

    /* Each row: its rank (added by the browser), the name, and the points pushed to the right. */
    #leaderboard { margin: 8px 0 0; padding-left: 24px; }
    #leaderboard li { padding: 3px 0; text-transform: lowercase; }  /* names are stored as typed, shown in lowercase */
    #leaderboard .points { float: right; font-weight: bold; }
    #leaderboard .me { color: var(--accent); }
    #leaderboard .gap { list-style: none; color: var(--muted); }  /* the "…" between the top 10 and the rows around you */
  </style>
</head>
<body>
<div id="page">
  <header>
    <h1>bouncemarket</h1>
    <p><span class="muted" id="my-name"></span> &nbsp;<span id="points"></span> <span class="muted">points</span></p>
  </header>

  <main>
    <section id="game">
      <div class="panel" id="board"><canvas id="canvas"></canvas></div>

      <div id="status-line">
        <span id="status">&nbsp;</span>
        <span id="countdown"></span>
      </div>

      <div id="market">
        <div class="side panel" id="left-side">
          <p class="label">Left</p>
          <p class="muted">Price per share</p>
          <p class="price" id="price-left"></p>
          <p class="muted">You hold <span id="shares-left">0</span></p>
          <button data-side="left">Buy 1 share</button>
        </div>
        <div class="side panel" id="right-side">
          <p class="label">Right</p>
          <p class="muted">Price per share</p>
          <p class="price" id="price-right"></p>
          <p class="muted">You hold <span id="shares-right">0</span></p>
          <button data-side="right">Buy 1 share</button>
        </div>
      </div>

      <p class="muted">Each winning share pays 1 point.</p>
    </section>

    <section id="sidebar">
      <div class="panel">
        <div class="panel-head">
          <h2>Market odds</h2>
          <span class="muted" id="odds-status"></span>
        </div>
        <div id="odds-labels"><span id="odds-left-label"></span><span id="odds-right-label"></span></div>
        <div id="odds-bar"><div id="odds-left"></div><div id="odds-right"></div></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <h2>Leaderboard</h2>
          <span class="muted"><span id="online"></span> online</span>
        </div>
        <!-- Shown until this player has claimed a name. -->
        <form id="claim" hidden>
          <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
          <button>Join</button>
          <p class="muted" id="claim-error"></p>
        </form>
        <ol id="leaderboard"></ol>
      </div>
      <p class="muted" id="tally"></p>
    </section>
  </main>
</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const FPS = 60;  // the ball moves one frame every 1/60 second
    const FADE_RATE = 4;  // how sharp the landing highlight's fade is: higher makes the start and end quicker and the middle flatter
    let board;
    let game = null;  // the latest public message: the state of the shared game
    let me = null;  // the latest private message: this player's name, points and shares
    let leaderboard = { top: [], around_me: [] };  // the latest leaderboard message: the top players, and the players around us if we're below them
    let queue = [];  // ball positions waiting until their frame is due, each [frame, x, y]
    let dropStart = null;  // on our clock, the moment the ball dropped
    let dropsAt = null;  // on our clock, the moment the next ball will drop (only between drops)

    // A random id, remembered by this browser, that tells the server which player we are.
    let playerId = localStorage.getItem("playerId");
    if (!playerId) {
      playerId = crypto.randomUUID();
      localStorage.setItem("playerId", playerId);
    }

    function circle(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fill();
    }

    function polygon(points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (const [x, y] of points) ctx.lineTo(x, y);
      ctx.fill();
    }

    // Draw the walls, pins and divider, plus the ball if a position is given.
    // Between drops there is no ball. Instead the bucket it landed in starts out yellow,
    // the ball's color, and fades back to the board's grey by the time the next ball drops.
    function draw(ball) {
      const w = board.width, h = board.height, mid = board.width / 2, top = board.last_row_y;
      // The walls lean in, so the board is a trapezoid. inset(y) is how far in a wall is at height y.
      const inset = (y) => board.wall_slant * y / h;
      ctx.clearRect(0, 0, w, h);
      // The inside of the board is a shade darker than the panel around it.
      polygon([[0, 0], [inset(h), h], [w - inset(h), h], [w, 0]], "#141414");
      if (!ball && game && game.last_bucket && dropsAt !== null) {
        // How far through the countdown we are, from 0 at landing to 1 at the next drop.
        const progress = Math.min(1, Math.max(0, 1 - (dropsAt - performance.now()) / 1000 / board.countdown_seconds));
        // A reverse S-curve: fades fast at first, lingers around half strength, then fades fast
        // again at the end. sinh is steep at both ends and flat in the middle, and dividing by
        // sinh(FADE_RATE) scales it so the highlight starts at exactly 1 and ends at exactly 0.
        ctx.globalAlpha = 0.5 - 0.5 * Math.sinh(FADE_RATE * (2 * progress - 1)) / Math.sinh(FADE_RATE);
        // The bucket: from the last row of pins down to the floor, between the wall and the divider.
        const bucket = game.last_bucket === "left"
          ? [[inset(top), top], [inset(h), h], [mid, h], [mid, top]]
          : [[w - inset(top), top], [w - inset(h), h], [mid, h], [mid, top]];
        polygon(bucket, "#fc3");
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = "#888";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(1, 0);  // the walls and floor, as one open-topped trapezoid
      ctx.lineTo(inset(h) + 1, h - 1);
      ctx.lineTo(w - inset(h) - 1, h - 1);
      ctx.lineTo(w - 1, 0);
      ctx.moveTo(mid, top);  // divider between the buckets
      ctx.lineTo(mid, h);
      ctx.stroke();
      for (const [x, y] of board.pins) circle(x, y, board.pin_r, "#888");
      if (ball) circle(ball[0], ball[1], board.ball_r, "#fc3");
    }

    // Show everything except the ball, from the latest public and private messages.
    function render() {
      if (!game || !me) return;
      document.getElementById("points").textContent = me.points;
      document.getElementById("online").textContent = game.online;
      const { left, right } = game.landed;
      const drops = left + right;
      document.getElementById("tally").textContent = drops === 0
        ? "No drops yet"
        : `Past ${drops} ${drops === 1 ? "drop" : "drops"} · ${left} left, ${right} right`;

      // Offer the name form until we have a name, then show the name instead.
      document.getElementById("claim").hidden = me.name !== null;
      document.getElementById("my-name").textContent = me.name || "Guest";

      // A share can be bought while betting is open, if we can afford its price.
      for (const buyButton of document.querySelectorAll(".side button")) {
        const side = buyButton.dataset.side;
        const price = game.prices[side];
        document.getElementById("price-" + side).textContent = price.toFixed(2);
        document.getElementById("shares-" + side).textContent = me.shares[side];
        buyButton.disabled = !game.betting_open || price > me.points;
      }

      // Market odds. The two prices always add up to 1, so each is the chance the market gives
      // that side. Rounded so the two percentages still add up to 100.
      const leftPercent = Math.round(game.prices.left * 100);
      const rightPercent = 100 - leftPercent;
      document.getElementById("odds-left-label").textContent = `Left ${leftPercent}%`;
      document.getElementById("odds-right-label").textContent = `${rightPercent}% Right`;
      const leftBar = document.getElementById("odds-left");
      const rightBar = document.getElementById("odds-right");
      leftBar.style.flexGrow = leftPercent;
      rightBar.style.flexGrow = rightPercent;
      leftBar.title = `Left: ${leftPercent}% chance, ${game.prices.left.toFixed(2)} per share`;
      rightBar.title = `Right: ${rightPercent}% chance, ${game.prices.right.toFixed(2)} per share`;
      document.getElementById("odds-status").textContent =
        !game.dropping ? "Even until the drop" : game.betting_open ? "Live" : "Betting closed";

      // The status line: what is happening on the left, and the countdown on the right.
      let status = "Waiting for the first drop";
      if (game.dropping) {
        status = game.betting_open ? "Betting open" : "Betting closed";
      } else if (game.last_bucket) {
        const sign = me.last_won > 0 ? "+" : "";
        status = `Landed ${game.last_bucket} · ${sign}${me.last_won} points`;
      }
      document.getElementById("status").textContent = status;
      document.getElementById("countdown").textContent =
        game.dropping ? "" : `Next drop in ${Math.ceil(game.seconds_to_drop)}s`;
    }

    // Each buy button asks the server to buy one share on its side at the current price.
    // The server answers with our new points and shares.
    for (const buyButton of document.querySelectorAll(".side button")) {
      buyButton.onclick = async () => {
        const response = await fetch("/buy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ player: playerId, side: buyButton.dataset.side }),
        });
        if (response.ok) {
          me = await response.json();
          render();
        }
      };
    }

    // Claim a name, which puts us on the leaderboard.
    document.getElementById("claim").onsubmit = async (event) => {
      event.preventDefault();  // stop the browser reloading the page, its default for forms
      const response = await fetch("/name", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player: playerId, name: document.getElementById("name").value }),
      });
      const result = await response.json();
      if (response.ok) {
        me = result;
        render();
        showLeaderboard();  // to highlight our new name
      } else {
        document.getElementById("claim-error").textContent = result.error;
      }
    };

    // The top players, then, if we're ranked below them, a "…" gap and the players around us.
    function showLeaderboard() {
      const toRow = (entry) => {
        const row = document.createElement("li");
        row.value = entry.rank;  // the number the list shows, so the rows around us show e.g. 45 to 49
        const name = document.createElement("span");
        const points = document.createElement("span");
        name.textContent = entry.name;
        points.textContent = entry.points;
        points.className = "points";
        row.append(name, points);
        if (me && entry.name === me.name) row.className = "me";
        return row;
      };
      const rows = leaderboard.top.map(toRow);
      const aroundMe = leaderboard.around_me;
      // Only show the gap if some ranks really are skipped (not when we're 11th or 12th).
      if (aroundMe.length > 0 && aroundMe[0].rank > leaderboard.top.length + 1) {
        const gap = document.createElement("li");
        gap.className = "gap";
        gap.textContent = "…";
        rows.push(gap);
      }
      rows.push(...aroundMe.map(toRow));
      document.getElementById("leaderboard").replaceChildren(...rows);
    }

    // The public "game" message arrives 10 times a second. While the ball is falling, each
    // one carries the next few ball positions, a little ahead of time. We queue them and
    // play them back on our own clock, so uneven arrival times don't make the ball stutter.
    function receiveGame(update) {
      game = update;
      render();
      if (!game.dropping) {
        queue = [];
        dropStart = null;
        // Set once per countdown, so network jitter in later messages doesn't make the fade flicker.
        if (dropsAt === null) dropsAt = performance.now() + game.seconds_to_drop * 1000;
        return;
      }
      dropsAt = null;
      // game.frame is the frame the server is on right now, which tells us when the drop began.
      if (dropStart === null) dropStart = performance.now() - game.frame * 1000 / FPS;
      game.positions.forEach(([x, y], i) => queue.push([game.first_position + i, x, y]));
    }

    // Runs before every screen refresh. While the ball falls, draw the newest queued position
    // whose frame is due. Between drops, redraw the board so the bucket highlight fades smoothly.
    function play(now) {
      if (dropStart !== null) {
        const dueFrame = (now - dropStart) / 1000 * FPS;
        let latest = null;
        while (queue.length > 0 && queue[0][0] <= dueFrame) latest = queue.shift();
        if (latest) draw([latest[1], latest[2]]);
      } else if (dropsAt !== null) {
        draw(null);
      }
      requestAnimationFrame(play);
    }

    async function init() {
      const response = await fetch("/board");
      board = await response.json();
      canvas.width = board.width;
      canvas.height = board.height;
      draw(null);
      // The server sends a stream of messages for as long as the page is open: a private
      // "me" message with our name, points and shares, the public "game" message, and the leaderboard.
      // If the connection drops, the browser reconnects by itself.
      const stream = new EventSource("/events?player=" + playerId);
      stream.addEventListener("me", (event) => { me = JSON.parse(event.data); render(); showLeaderboard(); });
      stream.addEventListener("leaderboard", (event) => { leaderboard = JSON.parse(event.data); showLeaderboard(); });
      stream.addEventListener("game", (event) => receiveGame(JSON.parse(event.data)));
      requestAnimationFrame(play);
    }
    init();
  </script>
</body>
</html>
