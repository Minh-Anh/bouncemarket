<!doctype html>
<html lang="en">
<head>
  <!-- The public page for one best-round card, /r/<share_id>. The server fills in each {{...}}
       (see share_page() in bouncemarket/web/share.py): the words and picture for link previews, and the card itself. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23111'/><circle cx='16' cy='16' r='7' fill='%23fc3'/></svg>">
  <!-- What chat and social apps show when someone pastes the link: a title, a line, and a picture of the card. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="bouncemarket">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  {{image_tags}}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <link rel="stylesheet" href="/card.css">
  <link rel="stylesheet" href="/share.css">
</head>
<body>
  <main>
    <a class="title" href="/">bouncemarket</a>
    <div id="replay" hidden>
      <div class="panel" id="board"><canvas id="canvas" aria-label="the round played again: the ball falling and landing"></canvas></div>
      <div id="replay-line">
        <span id="replay-status" aria-live="off"></span>
        <button type="button" class="text-button" id="skip" hidden>skip</button>
      </div>
    </div>
    <div id="card"></div>
    <p class="muted" id="message">{{message}}</p>
    <noscript><p>{{description}}</p></noscript>
    <p class="muted">a ball will fall. trade on where it lands.</p>
    <div id="actions">
      <button type="button" class="text-button" id="again" hidden>watch again</button>
      <a class="play" id="play" href="/">play</a>
    </div>
  </main>
  <script type="application/json" id="record">{{card}}</script>
  <script src="/board.js"></script>
  <script src="/card.js"></script>
  <script src="/replay.js"></script>
  <script src="/share.js"></script>
</body>
</html>
