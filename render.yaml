# Tells Render (render.com) how to build and run the app.
services:
  - type: web
    name: bouncemarket
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:  # set these in the Render dashboard; "sync: false" keeps their values out of this file
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
